[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "context-passport-conformance"
version = "1.1.0"
description = "Conformance test suite and runner for the Context Passport open standard."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
  { name = "Context Passport maintainers" }
]
requires-python = ">=3.9"
keywords = ["context-passport", "conformance", "testing", "ai-agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
reference = ["context-passport>=2.0.0"]

[project.scripts]
context-passport-conformance = "context_passport_conformance.python.run:main"

[project.urls]
Homepage      = "https://contextpassport.com"
Specification = "https://github.com/contextpassport/spec"
Repository    = "https://github.com/contextpassport/conformance-tests"
Issues        = "https://github.com/contextpassport/conformance-tests/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
context_passport_conformance = ["vectors/**/*.json"]
