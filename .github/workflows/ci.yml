name: Conformance

# This suite is the only artifact that proves Context Passport is portable
# rather than implementation-defined. Two reference implementations agreeing
# on paper is not evidence. Agreeing on bytes, on every push, is.
#
# Both jobs run against the published packages rather than a local checkout,
# because what implementers actually install is what has to be correct.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'   # Mondays, 06:17 UTC
  workflow_dispatch:

jobs:
  vectors:
    name: Reference vectors (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # The signing extra is required for the signed vectors below. The
      # [reference] extra pulls plain context-passport, which raises
      # ImportError on the Ed25519 path rather than skipping it.
      - run: pip install -e ".[reference]" "context-passport[signing]"

      # --level signed, not the core default. Core runs 6 of the 9 published
      # vectors and leaves v07 to v09 untouched, so signing regressions would
      # pass CI silently. There is no --level full yet, by design: the runner
      # exits 1 there to prevent green-ticking a level with no vectors.
      - run: python -m context_passport_conformance.python.run --level signed

  polyglot:
    name: Python and TypeScript produce identical bytes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      # The signing extra is required here, not optional. The suite verifies
      # signed vector v07 in both implementations, and plain context-passport
      # raises ImportError on that path rather than skipping it.
      - run: pip install "context-passport[signing]"

      - run: npm install @contextpassport/core

      - run: bash runner/polyglot/run.sh
